<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job console</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfaf8; --card: #fff; --ink: #1c1b19; --dim: #6b6862;
    --line: #e5e1da; --bar: #e8e4dc;
    --go: #3f7d58; --wait: #b0872b; --dead: #b3402f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171614; --card: #201e1c; --ink: #ece9e4; --dim: #9a958c;
      --line: #302d29; --bar: #302d29;
      --go: #6fbf8e; --wait: #d9ab52; --dead: #e07a68;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 48px; background: var(--bg); color: var(--ink);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -.01em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 24px; }
  .job {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .name { font-weight: 600; font-size: 15px; }
  .pill {
    font-size: 11px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid currentColor; font-weight: 600; letter-spacing: .02em;
  }
  .go { color: var(--go); } .wait { color: var(--wait); } .dead { color: var(--dead); }
  .pct { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--dim); font-size: 13px; }
  .detail { color: var(--dim); font-size: 13px; margin: 4px 0 12px; }
  .track { height: 7px; background: var(--bar); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
  .fill.go { background: var(--go); } .fill.wait { background: var(--wait); }
  .fill.dead { background: var(--dead); }
  .meta {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-top: 9px; font-size: 12px; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; }
  .foot { color: var(--dim); font-size: 12px; text-align: center; margin-top: 22px; }
</style>
<div class="wrap">
  <h1>Job console</h1>
  <div class="sub">Background jobs and pipeline totals — refreshed every 5s</div>
  <div id="jobs"></div>
  <div class="foot" id="foot">loading…</div>
</div>
<script>
const box = document.getElementById('jobs'), foot = document.getElementById('foot');

function state(job) {
  if (job.alive) return ['go', 'running'];
  // A finished pipeline stat is not a dead process; do not alarm about it.
  if (job.total && job.done >= job.total) return ['go', 'done'];
  return ['dead', 'stopped'];
}

function render(data) {
  box.innerHTML = '';
  if (data.error) {
    box.innerHTML = '<div class="job">could not read status: ' +
      String(data.error).replace(/[<&]/g, '') + '</div>';
    return;
  }
  for (const job of data.jobs) {
    const [cls, label] = state(job);
    // A row with no total is a state, not a quantity: an empty track reads as
    // a job that has done nothing, when it is simply waiting its turn.
    const stateOnly = !job.total;
    const el = document.createElement('div');
    el.className = 'job';
    el.innerHTML = `
      <div class="top">
        <span class="name"></span>
        <span class="pill ${cls}">${label}</span>
        <span class="pct">${stateOnly ? '' : job.pct.toFixed(1) + '%'}</span>
      </div>
      <div class="detail"></div>
      ${stateOnly ? '' :
        `<div class="track"><div class="fill ${cls}" style="width:${job.pct}%"></div></div>`}
      <div class="meta">
        <span class="count"></span>
        <span><code class="log"></code></span>
      </div>`;
    el.querySelector('.name').textContent = job.name;
    el.querySelector('.detail').textContent = job.detail;
    el.querySelector('.count').textContent = job.total
      ? `${job.done.toLocaleString()} / ${job.total.toLocaleString()}`
      : job.detail;
    el.querySelector('.log').textContent = job.log;
    box.appendChild(el);
  }
  const age = Math.max(0, Math.round(Date.now() / 1000 - data.updated));
  foot.textContent = `updated ${age}s ago` + (age > 30 ? ' — status writer may have stopped' : '');
}

async function tick() {
  try {
    const r = await fetch('status.json?t=' + Date.now(), { cache: 'no-store' });
    render(await r.json());
  } catch (e) {
    foot.textContent = 'cannot read status.json — is the status writer running?';
  }
}
tick();
setInterval(tick, 5000);
</script>
