# The daily scrape, run by GitHub rather than by a laptop.
#
# WHY THIS EXISTS
# The 6am launchd job only fires if the Mac is awake, and a closed lid puts a
# MacBook to sleep regardless of any power assertion. This runs whether the
# machine is open, shut, or in a bag.
#
# WHAT IT DELIBERATELY DOES NOT DO
# No tailoring, no cover letters, no applying. Those need the resume and the
# applicant's own details, and neither belongs on someone else's computer.
# This job only ever handles PUBLIC job postings, plus one secret describing
# which job titles to look for.
#
# WHERE THE DATA LIVES, AND WHY NOT THE OBVIOUS PLACES
# This repository is public, so:
#   - committing data/jobs.db would publish every posting tracked and every
#     application status;
#   - uploading it as an artifact is no better, because artifacts on a public
#     repository can be downloaded by anyone.
# The Actions cache is the one store only this repository's own workflow runs
# can read, so that is where the database lives between runs.
#
# FOUR PARTS AT ONCE (2 Nov 2026)
# One machine read every site six boards at a time, about three and a half hours,
# mostly queueing. `plan` splits the job SITES four ways (devops/fetch_parts.py);
# each part reads its own sites on its own machine at the same polite pace (README
# §C5: every board of a site on one machine, 1.5 s between requests to a host);
# `join` puts the four together and saves them as one database. The slowest single
# host sets the floor: Greenhouse, about 2 h 15 min. The parts travel between jobs
# encrypted, like the result, and are kept one day.

name: Daily scrape

on:
  schedule:
    # 06:17 UTC = 01:17 America/Chicago (00:17 in winter: cron is UTC only). Early
    # on purpose: GitHub started the 11:17 schedule three to four hours late every
    # day in October 2026 (09:13-10:23 local), and the postings are wanted by the
    # time the laptop opens. The Mac takes them, waits for a run under way, or
    # reads the boards itself when there is none (devops/cloud_results.py).
    # Minute 17 on purpose: every scheduled job in the world asks for :00, the
    # queue is deepest there, and a job that has to wait is a job that runs late.
    - cron: "17 6 * * *"
  # And whenever the button is pressed: by you, or by the Mac at 8 pm and in the
  # morning once `cloud.trigger_runs` is switched on (devops/cloud_results.py).
  workflow_dispatch:

concurrency:
  # Never let two scrapes touch the same cached database.
  group: daily-scrape
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the job database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          # The newest saved copy. Only `join` saves, so every part starts from this same one.
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Split the job sites into four parts
        # Balanced by how long each site took last time; standard library only. Site names
        # and counts only: this log is public.
        id: plan
        run: python -m devops.fetch_parts plan --db data/jobs.db --parts 4 >> "$GITHUB_OUTPUT"

  scrape:
    needs: plan
    runs-on: ubuntu-latest
    # A part is about two and a quarter hours at most. The ceiling is six.
    timeout-minutes: 330
    strategy:
      # One part failing fails the run: the Mac takes only a run that read every site,
      # and reads the boards itself otherwise.
      fail-fast: true
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the job database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Write the search profile
        # Derived from the resume, so it names the person's job titles and
        # seniority: a secret, not a file in a public repo. Without it the
        # scraper refuses to run rather than falling back to someone else's
        # search, which is the behaviour we want here too.
        env:
          SEARCH_PROFILE: ${{ secrets.SEARCH_PROFILE_YAML }}
        run: |
          if [ -z "$SEARCH_PROFILE" ]; then
            echo "::error::SEARCH_PROFILE_YAML secret is not set."
            echo "Add it with:  gh secret set SEARCH_PROFILE_YAML < backend/config/search_profile.yaml"
            exit 1
          fi
          mkdir -p config
          printf '%s' "$SEARCH_PROFILE" > backend/config/search_profile.yaml
          echo "Search profile written ($(wc -l < backend/config/search_profile.yaml) lines)."

      - name: Unlock the full board list
        # The full list is not in this public repository: the Mac sends it as an
        # encrypted release asset whenever it changes (devops/cloud_results.py
        # push-boards), locked with the same passphrase as the results. Without
        # it, or the passphrase, the older list in backend/config/boards.csv is
        # read instead. Counts only in the log, which is public.
        env:
          GH_TOKEN: ${{ github.token }}
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
        run: |
          if [ -n "$PASSPHRASE" ] && gh release download cloud-boards --pattern boards.csv.enc --dir "$RUNNER_TEMP" 2>/dev/null; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -in "$RUNNER_TEMP/boards.csv.enc" \
                 -out "$RUNNER_TEMP/boards.csv" -pass env:PASSPHRASE 2>/dev/null; then
              mv "$RUNNER_TEMP/boards.csv" backend/config/boards.csv
              echo "Full board list unlocked: $(( $(wc -l < backend/config/boards.csv) - 1 )) boards."
            else
              echo "::warning::The board list could not be unlocked; reading the repository's older list."
            fi
          else
            echo "::warning::No encrypted board list; reading the repository's older list."
          fi

      - name: Seed the board list
        # The boards live in data/jobs.db, which is gitignored, so a runner
        # with a cold cache starts with nothing to scrape -- the first cloud
        # run walked 8 boards instead of 1,501 for exactly this reason.
        # backend/config/boards.csv carries the list separately: employer names and
        # public board addresses, safe for a public repository, and nothing
        # about the person searching. The import is keyed on (source, slug),
        # so running it against a warm cache adds nothing. Every part imports
        # all of it; the join keeps each site's boards from its own part only.
        run: python -m data_engineering.boards import

      - name: Scrape this part's job sites
        env:
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
          SITES: ${{ matrix.part.sites }}
          SKIP: ${{ matrix.part.skip }}
        run: python -u main.py scrape --sites "$SITES" --skip-sites "$SKIP"

      # NO SCORING HERE. Scoring compares a posting against the resume text,
      # and the resume is not on this machine -- by design, since it is the
      # one thing that should never leave the laptop. The first run failed on
      # exactly this: "No base resume found". Scoring happens locally, after
      # the Mac brings the postings down (devops/cloud_results.py).

      - name: Lock this part for the join
        # Artifacts on a public repository can be downloaded by anyone: locked
        # like the result, or not sent at all.
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::RESULTS_PASSPHRASE is not set: the four parts cannot travel to the join unlocked."
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -in data/jobs.db -out part.db.enc -pass env:PASSPHRASE
          ls -lh part.db.enc

      - name: Hand it to the join
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.part.name }}
          path: part.db.enc
          retention-days: 1

  join:
    needs: [plan, scrape]
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the job database
        # The same copy every part started from.
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Collect the parts
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts

      - name: Join the four parts
        # Each site's rows from the part that read it, and from no other; every
        # posting a part holds must be in the result exactly once, or nothing is
        # saved and the run fails (the Mac then reads the boards itself).
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
          PLAN: ${{ needs.plan.outputs.parts }}
        run: |
          for locked in parts/part-*/part.db.enc; do
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
              -in "$locked" -out "${locked%.enc}" -pass env:PASSPHRASE
          done
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          python -m devops.fetch_parts join --db data/jobs.db --plan "$RUNNER_TEMP/plan.json" --parts-dir parts

      - name: Save the job database
        # A new key every run so each saves a fresh copy; the restores above fall
        # back to the most recent one.
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}

      - name: Encrypt the database for collection
        # The cache cannot be downloaded to a laptop, and an artifact on a
        # public repository can be downloaded by anyone -- so the artifact is
        # encrypted before it leaves the runner. Without RESULTS_PASSPHRASE it
        # is a 25MB blob of noise to everyone including GitHub; with it, one
        # command on the Mac turns it back into the job database.
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -in data/jobs.db -out jobs.db.enc -pass env:PASSPHRASE
          ls -lh jobs.db.enc

      - name: Upload it
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db-encrypted
          path: jobs.db.enc
          retention-days: 7

      - name: Summary
        if: always()
        # Counts only. This summary is public on a public repository, so it
        # says how many, never which.
        run: |
          python devops/actions_summary.py >> "$GITHUB_STEP_SUMMARY"
