# The daily scrape, run by GitHub rather than by a laptop.
#
# WHY THIS EXISTS
# The 6am launchd job only fires if the Mac is awake, and a closed lid puts a
# MacBook to sleep regardless of any power assertion. This runs whether the
# machine is open, shut, or in a bag.
#
# WHAT IT DELIBERATELY DOES NOT DO
# No tailoring, no cover letters, no applying. Those need the resume and the
# applicant's own details, and neither belongs on someone else's computer.
# This job only ever handles PUBLIC job postings, plus one secret describing
# which job titles to look for.
#
# WHERE THE DATA LIVES, AND WHY NOT THE OBVIOUS PLACES
# This repository is public, so:
#   - committing data/jobs.db would publish every posting tracked and every
#     application status;
#   - uploading it as an artifact is no better, because artifacts on a public
#     repository can be downloaded by anyone.
# The Actions cache is the one store only this repository's own workflow runs
# can read, so that is where the database lives between runs. Everything that
# travels as an artifact is locked first (RESULTS_PASSPHRASE), except the
# per-partition reports and the coverage report, which carry counts only.
#
# INDEPENDENT PARTITIONS (Nov 2026; before: four parts, devops/fetch_parts.py)
# Four parts split whole job SITES four ways and failed as one: a slow or
# rate-limited site held up, or failed, every other site's results. Now `plan`
# gives every board to exactly one partition, each job site its own lane, a big
# site split over a few partitions (devops/discovery_plan.py, lanes in
# devops/discovery_lanes.json). Each partition reads only its own boards on its
# own machine, from its own copy of the saved database, within a time budget,
# and hands back only its own boards' rows (devops/discovery_worker.py). `join`
# checks and merges each one on its own (devops/discovery_merge.py): a failed or
# rate-limited partition never spoils another's work, and a posting is closed
# only where its board was really read.
#
# Politeness does not grow with the matrix: each site has a budget of boards read
# at once across all its partitions (one machine per one-host site unless its
# budget says more; since Nov 2026 Greenhouse 3, Lever 2, Ashby 2, one board at a
# time each), the 1.5 s gap per host stays (README §C5), and a provider several of
# whose hosts refuse every retry is left alone as a whole until it cools off --
# never asked faster through another host. Workable and Jobvite are asked a quota
# of boards a run, the least recently read first; a site that refused nearly every
# board of its last run (Workday, from late Nov 2026) is asked only a small probe
# of its least recently read boards until it answers again. Every site is read
# here: none is left to the Mac.
#
# THE JOB-SEARCH SITES (job `feeds`, devops/discovery_feeds.py): Adzuna, the job
# feeds and, once a dedicated job-alert mailbox is set, its alert emails, read on
# their own machine beside the partitions with their keys from this repository's
# encrypted secrets, and merged after the boards.
#
# WHEN IT RUNS (25 Nov 2026): twice a day, from the cloud, the Mac on or off --
# 1:00 and 11:00 America/Chicago, the results published by 3:00 and 13:00. The
# outside scheduler (cron-job.org) starts it at the minute through
# workflow_dispatch with trigger=scheduler; GitHub's own schedule below is only a
# fallback (it started 3-12 hours late on every one of 68 measured days). The
# first run of a window reads it; a later one for the same window stops at once
# (devops/discovery_slot.py). The button (trigger=manual) always runs.
#
# WHAT THE MAC TAKES (devops/cloud_results.py)
# Three statuses, kept apart: the workflow's execution (this run's conclusion),
# the scan's completeness (the coverage report), and the result's validity
# (checked on the Mac). This run ends in success only when the coverage is
# COMPLETE -- every board of every partition read in full; then it also
# publishes jobs-db-encrypted, as every complete run before (an older Mac takes
# that). Complete or not, whenever the merge succeeded it publishes
# discovery-result-v1: the database, the plan and every board's outcome, signed
# and locked (devops/discovery_result.py). The Mac verifies it whole when it is next
# on, and takes the postings of the boards read and nothing of the others; it reads
# no board itself. The boards not read are asked again by the next cloud runs. A PARTIAL result is never called
# complete; a failed Workday partition costs Greenhouse, Lever, Ashby and
# BambooHR nothing.
# A failed partition can be run again with "Re-run failed jobs": the partitions
# that ran are not read again, and the join merges what is new.

name: Daily scrape

# The code this fetch runs is pinned to one tested commit, not to this branch or
# any moving branch: every checkout below names CODE_REF. To run newer code,
# change CODE_REF on purpose (to a commit whose tests passed). To go back to the
# four-part fetch, restore the workflow of the commit that pinned fd11a5c.
env:
  CODE_REF: "833689445362f446ac37e0beb15c6901de0a5dc1"   # quoted: a SHA of digits alone would be a number in YAML

on:
  # The fallback: GitHub's schedule is UTC only, so each window has two lines, one for
  # Central daylight time and one for standard time; whichever comes first for a window
  # reads it (unless the outside scheduler already did), the other stops at once.
  #   1:00 Central  = 06:00 UTC (CDT) / 07:00 UTC (CST)
  #  11:00 Central  = 16:00 UTC (CDT) / 17:00 UTC (CST)
  schedule:
    - cron: "23 6,7,16,17 * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Who starts it: manual (always runs) or scheduler (the outside scheduler: once per window)"
        required: false
        default: "manual"
      partitions:
        description: "More partitions (e.g. 12 or 16): added only where a site gets faster within its budget"
        required: false
        default: ""
      budget_minutes:
        description: "Time budget per partition, minutes (boards not reached by then are reported, never counted read)"
        required: false
        default: ""
      only:
        description: "Run only these partitions or sites, comma-separated (the rest are NOT ATTEMPTED; the run fails)"
        required: false
        default: ""

# A run started by hand is a development (or maintenance) run: named so in the Actions list, it always runs, and it
# is never counted as a scheduled window's read (devops/discovery_slot.py DEV_MARK). The outside scheduler and
# GitHub's schedule keep the plain name.
run-name: ${{ github.event_name == 'workflow_dispatch' && inputs.trigger != 'scheduler' && 'Daily scrape [development run]' || 'Daily scrape' }}

concurrency:
  # Never let two scrapes touch the same cached database.
  group: daily-scrape
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read            # the window check lists this workflow's runs
    outputs:
      go: ${{ steps.slot.outputs.go }}
      matrix: ${{ steps.plan.outputs.matrix }}
      runners: ${{ steps.plan.outputs.runners }}
      plan_id: ${{ steps.plan.outputs.plan_id }}
      budget: ${{ steps.plan.outputs.budget }}
      started: ${{ steps.plan.outputs.started }}
      slot: ${{ steps.slot.outputs.slot }}
      restored_from: ${{ steps.restore.outputs.restored_from }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}

      - name: Check the pinned code
        # Every other job needs this one: a wrong pin stops the run here, loudly, rather than running
        # other code quietly. The pinned commit must be the one checked out, and must hold the
        # partitioned fetch this workflow drives, with the complete-refresh rule.
        run: |
          if [ "$(git rev-parse HEAD)" != "$CODE_REF" ]; then
            echo "::error::Checked out $(git rev-parse HEAD), not the pinned $CODE_REF."
            exit 1
          fi
          for f in devops/discovery_plan.py devops/discovery_worker.py devops/discovery_merge.py devops/discovery_result.py devops/discovery_lanes.json devops/discovery_slot.py devops/discovery_feeds.py; do
            if [ ! -f "$f" ]; then
              echo "::error::The pinned commit has no $f: it predates the partitioned fetch."
              exit 1
            fi
          done
          if ! grep -q 'complete_refresh' devops/discovery_merge.py; then
            echo "::error::The pinned commit's merge predates the complete-refresh rule."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Is this window read already?
        # Once per window (devops/discovery_slot.py): a later start of the same window stops here,
        # and every other job is skipped. The button always runs.
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER: ${{ github.event.inputs.trigger }}
        run: |
          python -m devops.discovery_slot --event "${{ github.event_name }}" --trigger "$TRIGGER" \
            --run-id "${{ github.run_id }}" --repo "${{ github.repository }}" | tee -a "$GITHUB_OUTPUT"

      - name: Restore the job database
        if: steps.slot.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          # The newest saved copy. Only `join` saves, so every partition starts from this same one.
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: If the cache held no saved database, restore it from the newest verified result
        # devops/discovery_restore.py: downloaded, unlocked and checked as the Mac checks it, at most 6 days old.
        # Nothing usable: a cold start, said as one (never presented as continuous).
        if: steps.slot.outputs.go == 'true'
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
        run: |
          if [ -e data/jobs.db ]; then
            echo "restored_from=" >> "$GITHUB_OUTPUT"
          else
            python -m devops.discovery_restore --dest data/jobs.db --repo "$GITHUB_REPOSITORY"
          fi

      - name: Keep the restored database for this run's partitions and join
        if: steps.slot.outputs.go == 'true' && steps.restore.outputs.restored_from != ''
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-restored

      - name: Unlock the full board list
        if: steps.slot.outputs.go == 'true'
        # The full list is not in this public repository: the Mac sends it as an
        # encrypted release asset whenever it changes (devops/cloud_results.py
        # push-boards). Without it, or the passphrase, the older list in
        # backend/config/boards.csv is read instead. Counts only in the log.
        env:
          GH_TOKEN: ${{ github.token }}
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
        run: |
          if [ -n "$PASSPHRASE" ] && gh release download cloud-boards --pattern boards.csv.enc --dir "$RUNNER_TEMP" 2>/dev/null; then
            if openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -in "$RUNNER_TEMP/boards.csv.enc" \
                 -out "$RUNNER_TEMP/boards.csv" -pass env:PASSPHRASE 2>/dev/null; then
              mv "$RUNNER_TEMP/boards.csv" backend/config/boards.csv
              echo "Full board list unlocked: $(( $(wc -l < backend/config/boards.csv) - 1 )) boards."
            else
              echo "::warning::The board list could not be unlocked; reading the repository's older list."
            fi
          else
            echo "::warning::No encrypted board list; reading the repository's older list."
          fi

      - name: Give every board to exactly one partition
        if: steps.slot.outputs.go == 'true'
        # Standard library only. Partition ids, sites and counts in the log -- never a board.
        id: plan
        env:
          PARTITIONS: ${{ github.event.inputs.partitions }}
          BUDGET: ${{ github.event.inputs.budget_minutes }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          echo "started=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          python -m devops.discovery_plan plan --db data/jobs.db --boards-csv backend/config/boards.csv \
            --target-total "$PARTITIONS" --budget-minutes "$BUDGET" --only "$ONLY" \
            --out "$RUNNER_TEMP/manifest.json" >> "$GITHUB_OUTPUT"

      - name: Lock the plan
        if: steps.slot.outputs.go == 'true'
        # It names every board: locked like the results.
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
        run: |
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::RESULTS_PASSPHRASE is not set: the plan cannot travel to the partitions unlocked."
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -in "$RUNNER_TEMP/manifest.json" -out manifest.json.enc -pass env:PASSPHRASE

      - uses: actions/upload-artifact@v4
        if: steps.slot.outputs.go == 'true'
        with:
          name: plan-manifest
          path: manifest.json.enc
          retention-days: 1

  scrape:
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    # The worker stops starting boards at its time budget and reports the rest;
    # this ceiling only catches a machine that hangs outright.
    timeout-minutes: 220
    strategy:
      # Each partition stands on its own: one failing never cancels the others.
      fail-fast: false
      max-parallel: 19     # GitHub runs 20 jobs at once and the feeds job is one; the longest partitions go first
      matrix:
        # One runner per group of partitions (devops/discovery_plan.py bundles): up to 3 readers side by side, never
        # two of one site, each its own process, database copy and client (the per-host gap is per reader, as before).
        runner: ${{ fromJSON(needs.plan.outputs.runners) }}
    name: scrape ${{ matrix.runner.id }} (${{ matrix.runner.parts }})

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cloud.txt

      - name: Install dependencies
        # The readers' own few packages (requirements-cloud.txt): seconds, not the app's 26 s on every runner.
        run: pip install -r requirements-cloud.txt

      - name: Restore the job database
        # This machine's own copy: no other partition writes to it.
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Write the search profile
        # Derived from the resume, so it names the person's job titles and
        # seniority: a secret, not a file in a public repo.
        env:
          SEARCH_PROFILE: ${{ secrets.SEARCH_PROFILE_YAML }}
        run: |
          if [ -z "$SEARCH_PROFILE" ]; then
            echo "::error::SEARCH_PROFILE_YAML secret is not set."
            exit 1
          fi
          printf '%s' "$SEARCH_PROFILE" > backend/config/search_profile.yaml

      - uses: actions/download-artifact@v4
        with:
          name: plan-manifest
          path: plan

      - name: Read these partitions' boards, side by side
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
          BUDGET: ${{ needs.plan.outputs.budget }}
          PARTS: ${{ matrix.runner.parts }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in plan/manifest.json.enc -out "$RUNNER_TEMP/manifest.json" -pass env:PASSPHRASE
          # Each partition: its own copy of the database, its own process, its own result. One failing never
          # stops the others; each is locked and handed on, and the step fails at the end if any did.
          pids=""
          for part in $PARTS; do
            mkdir -p "work/$part"
            if [ -e data/jobs.db ]; then cp data/jobs.db "work/$part/jobs.db"; fi    # none: a cold start
            DATABASE_URL="sqlite:///$PWD/work/$part/jobs.db" python -u -m devops.discovery_worker \
              --manifest "$RUNNER_TEMP/manifest.json" --partition "$part" --budget-minutes "$BUDGET" \
              --out "work/$part/out" > "work/$part/worker.txt" 2>&1 &
            pids="$pids $!:$part"
          done
          failed=0
          for entry in $pids; do
            pid="${entry%%:*}"; part="${entry#*:}"
            if wait "$pid"; then code=0; else code=$?; failed=1; fi
            sed "s/^/[$part] /" "work/$part/worker.txt"
            echo "[$part] exit $code"
          done
          exit $failed

      - name: Lock these partitions' results
        # Each result that exists, locked like everything else that travels -- also when another partition of
        # this runner failed. staged/part-<partition>/part.db.enc is the layout the join reads.
        if: always()
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
          PARTS: ${{ matrix.runner.parts }}
        run: |
          mkdir -p staged reports-staged
          for part in $PARTS; do
            if [ -e "work/$part/out/part.db" ]; then
              mkdir -p "staged/part-$part"
              openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
                -in "work/$part/out/part.db" -out "staged/part-$part/part.db.enc" -pass env:PASSPHRASE
            fi
            if [ -e "work/$part/out/report.json" ]; then
              mkdir -p "reports-staged/report-$part"
              cp "work/$part/out/report.json" "reports-staged/report-$part/report.json"
            fi
          done
          find staged -name '*.enc' -exec ls -lh {} +

      - name: Hand them to the join
        # staged/ holds only the locked results: part-<partition>/part.db.enc, as the join reads them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.runner.id }}
          path: staged/
          retention-days: 1
          overwrite: true
          if-no-files-found: ignore

      - name: Their reports (counts only)
        # Uploaded even when a partition failed, so the join can tell FAILED from NOT ATTEMPTED.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.runner.id }}
          path: reports-staged/
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  feeds:
    # The job-search sites and alert emails, beside the partitions (devops/discovery_feeds.py). Their keys are
    # this job's alone: no other job is given them, and nothing is printed but counts.
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read            # Workable's feed: has another run asked it within the hour?
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the job database
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - name: Write the search profile
        env:
          SEARCH_PROFILE: ${{ secrets.SEARCH_PROFILE_YAML }}
        run: |
          if [ -z "$SEARCH_PROFILE" ]; then
            echo "::error::SEARCH_PROFILE_YAML secret is not set."
            exit 1
          fi
          printf '%s' "$SEARCH_PROFILE" > backend/config/search_profile.yaml

      - name: Read the job-search sites and alert emails
        env:
          SCRAPER_CONTACT_EMAIL: ${{ secrets.SCRAPER_CONTACT_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          CAREERJET_AFFID: ${{ secrets.CAREERJET_AFFID }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          FINDWORK_API_KEY: ${{ secrets.FINDWORK_API_KEY }}
          # A dedicated job-alert mailbox only, opened read-only -- never the person's own mailbox.
          MAIL_ADDRESS: ${{ secrets.ALERTS_MAIL_ADDRESS }}
          MAIL_APP_PASSWORD: ${{ secrets.ALERTS_MAIL_APP_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: python -u -m devops.discovery_feeds --out out

      - name: Lock its result
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
        run: |
          tar -cf feeds.tar -C out feeds.db feeds-report.json
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -in feeds.tar -out feeds.tar.enc -pass env:PASSPHRASE
          ls -lh feeds.tar.enc

      - uses: actions/upload-artifact@v4
        with:
          name: feeds-result
          path: feeds.tar.enc
          retention-days: 1
          overwrite: true

  join:
    needs: [plan, scrape, feeds]
    # Also when some partitions, or the job-search sites, failed: the others' work is merged all the same. Not
    # when the run was cancelled, or when this window was read already.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.go == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CODE_REF }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore the job database
        # The same copy every partition started from.
        uses: actions/cache/restore@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}
          restore-keys: |
            jobs-db-

      - uses: actions/download-artifact@v4
        with:
          name: plan-manifest
          path: plan

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: parts
          merge-multiple: true        # each runner's artifact holds part-<partition>/ folders

      - uses: actions/download-artifact@v4
        with:
          pattern: report-*
          path: reports
          merge-multiple: true

      - uses: actions/download-artifact@v4
        continue-on-error: true       # the job-search sites failing never stops the boards' merge
        with:
          name: feeds-result
          path: feeds

      - name: Merge every partition whose result arrived
        # A result that cannot be unlocked is left out here and counted FAILED by the merge.
        id: merge
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
          STARTED: ${{ needs.plan.outputs.started }}
          RESTORED_FROM: ${{ needs.plan.outputs.restored_from }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
            -in plan/manifest.json.enc -out "$RUNNER_TEMP/manifest.json" -pass env:PASSPHRASE
          for locked in parts/part-*/part.db.enc; do
            [ -e "$locked" ] || continue
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
              -in "$locked" -out "${locked%.enc}" -pass env:PASSPHRASE || rm -f "${locked%.enc}"
          done
          if [ -e feeds/feeds.tar.enc ] && openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 \
               -in feeds/feeds.tar.enc -out feeds/feeds.tar -pass env:PASSPHRASE; then
            tar -xf feeds/feeds.tar -C feeds feeds.db feeds-report.json || rm -f feeds/feeds.db
          fi
          set +e
          # --prune-log-days: this saved copy's scrape log kept to 3 days (each board's newest row always kept, for
          # the plan; the latest run of each site, for its refusal share). Nothing else reads older rows: board
          # retirement counts on the board itself. 30 days had grown it to 385 MB of a 489 MB database (26 Nov
          # 2026), slowing every restore, merge and upload. The cloud's copy only; the Mac's history is never pruned.
          python -m devops.discovery_merge --db data/jobs.db --manifest "$RUNNER_TEMP/manifest.json" \
            --parts-dir parts --reports-dir reports --coverage coverage.json \
            --outcomes "$RUNNER_TEMP/outcomes.json" --started "$STARTED" --prune-log-days 3 \
            --feeds-dir feeds --restored-from "$RESTORED_FROM" > merge.txt
          code=$?
          set -e
          cat merge.txt >> "$GITHUB_STEP_SUMMARY"
          grep '^complete=' merge.txt >> "$GITHUB_OUTPUT" || true
          echo "merged=$([ $code -eq 0 ] || [ $code -eq 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Save the job database
        # Whatever was merged: boards that were read are newer, the rest as before.
        if: steps.merge.outputs.merged == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/jobs.db
          key: jobs-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Lock the database for collection
        id: lock
        if: steps.merge.outputs.merged == 'true'
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
        run: |
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -in data/jobs.db -out jobs.db.enc -pass env:PASSPHRASE
          ls -lh jobs.db.enc

      - name: Upload it (a complete refresh)
        id: complete_upload
        if: steps.merge.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jobs-db-encrypted
          path: jobs.db.enc
          retention-days: 7
          overwrite: true

      - name: Build the verified result
        id: build
        # Complete or not: the database, the plan, and every board's outcome, signed and locked as one file
        # (devops/discovery_result.py, contract v1). The Mac checks all of it and takes only the boards read. Its status is the coverage's -- a PARTIAL result is never complete.
        if: steps.merge.outputs.merged == 'true'
        env:
          PASSPHRASE: ${{ secrets.RESULTS_PASSPHRASE }}
          STARTED: ${{ needs.plan.outputs.started }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          SCRAPE_JOBS: ${{ needs.scrape.result }}
        run: |
          mkdir -p result
          python -m devops.discovery_result build --db data/jobs.db --manifest "$RUNNER_TEMP/manifest.json" \
            --outcomes "$RUNNER_TEMP/outcomes.json" --coverage coverage.json --out result/result.json \
            --run-id "$RUN_ID" --attempt "$ATTEMPT" --started "$STARTED" --scrape-jobs "$SCRAPE_JOBS"
          cp data/jobs.db result/jobs.db
          COPYFILE_DISABLE=1 tar -cf discovery-result.tar -C result result.json jobs.db   # exactly two members
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -md sha256 -salt \
            -in discovery-result.tar -out discovery-result.tar.enc -pass env:PASSPHRASE
          rm -rf result discovery-result.tar
          ls -lh discovery-result.tar.enc

      - name: Upload the verified result
        id: upload
        if: steps.merge.outputs.merged == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: discovery-result-v1
          path: discovery-result.tar.enc
          retention-days: 7
          overwrite: true

      - name: Coverage report (counts only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

      - name: Summary
        if: always()
        # Counts only. This summary is public on a public repository.
        run: |
          python devops/actions_summary.py >> "$GITHUB_STEP_SUMMARY" || true

      - name: Discovery outcome (COMPLETE, PARTIAL or FAILED)
        # devops/discovery_outcome.py, from the steps' own outcomes and the coverage report. COMPLETE: every board
        # read in full. PARTIAL: some boards not read (refused, rate-limited, deferred, failed at the board), all
        # accounted for, the verified result merged, checked, locked and published -- a warning, not a failure, and
        # never called a complete refresh; its unread boards stay for the next runs. FAILED (exit 1): the merge
        # stopped, a partition delivered nothing usable, no board was read, the coverage does not account for every
        # board, or locking, building and verifying, or publishing failed.
        if: always()
        env:
          SLOT: ${{ needs.plan.outputs.slot }}
          TRIGGER: ${{ github.event_name }}${{ github.event.inputs.trigger && format(' ({0})', github.event.inputs.trigger) || '' }}
          STARTED: ${{ needs.plan.outputs.started }}
          MERGE_CODE: ${{ steps.merge.outputs.code }}
          LOCK: ${{ steps.lock.outcome }}
          BUILD: ${{ steps.build.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          COMPLETE_UPLOAD: ${{ steps.complete_upload.outcome }}
        run: |
          python -m devops.discovery_outcome --coverage coverage.json --merge-code "$MERGE_CODE" \
            --lock "$LOCK" --build "$BUILD" --upload "$UPLOAD" --complete-upload "$COMPLETE_UPLOAD" \
            --result discovery-result.tar.enc --slot "$SLOT" --trigger "$TRIGGER" --started "$STARTED"
